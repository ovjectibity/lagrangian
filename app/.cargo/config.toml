# .cargo/config.toml

[build]
rustflags = [
  # ---- search paths ----
  "-L", "/Users/avi/Documents/manual/mujoco-build/lib",
  "-L", "/Users/avi/Documents/manual/lagrangian/app/lib/libtorch/lib",

  # ---- link the libs ----
  "-l", "mujoco",

  # Libtorch typically needs at least these:
  "-l", "torch",
  "-l", "c10",

  # Depending on your libtorch distro, you may need torch_cpu too:
  "-l", "torch_cpu",

  # ---- runtime search paths (rpath) ----
  "-C", "link-arg=-Wl,-rpath,/Users/avi/Documents/manual/mujoco-build/lib",
  "-C", "link-arg=-Wl,-rpath,/Users/avi/Documents/manual/lagrangian/app/lib/libtorch/lib",
]

[package]
name = "lagrangian"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = "0.5.1"
rocket_ws = "0.1.1"
typeshare = "1.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tch = "0.20.0"
aws-config = "1.8.8"
aws-sdk-ec2 = "1.175.0"
base64 = "0.22.1"
futures-util = "0.3.32"
http = "1.4.0"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }

// Wire-contract schema for the testing/simulation update stream.
//
// Transport: WebSocket. The worker serializes a `TestingStreamMessage` and sends
// it as a single raw binary frame (NOT base64). The app server forwards these
// binary frames to SDK subscribers verbatim (it never decodes them). The SDK
// decodes a `TestingStreamMessage` per frame.
//
// This `.proto` is the source of truth for the binary wire format. It mirrors the
// Rust `app/src/commondef/testing.rs` types (kept in parity by convention); the
// Rust server itself takes no protobuf dependency and treats frames as opaque.
//
// Control messages (e.g. StopTesting) are sent as JSON text frames, not protobuf.

syntax = "proto3";

package lagrangian.testing;

// A single body-pose forward from the simulator.
//
// `nbody` is carried explicitly even though it is redundant with the array
// lengths, so a reader knows the boundaries:
//   len(xpos) == nbody * 3   (x, y, z per body)
//   len(xquat) == nbody * 4  (w, x, y, z per body)
message ModelForward {
  int64 nbody = 1;             // number of bodies (= len(xpos)/3)
  repeated double xpos = 2;    // nbody*3, flattened [body][x,y,z]
  repeated double xquat = 3;   // nbody*4, flattened [body][w,x,y,z]
}

// One environment's time-sequence of forwards (wrapper: protobuf has no nested
// `repeated repeated`).
message EnvUpdates {
  repeated ModelForward updates = 1;   // indexed by timestep t
}

// One task's environment updates. Its position in `TestUpdate.simulation_state`
// is its position in the requested task list.
message TaskUpdates {
  int64 task_index = 1; // actual LIBERO task index
  repeated EnvUpdates environments = 2;   // indexed by environment
}

// Flattened camera buffer plus its dimensions.
//
// Dimensions come first so a reader knows how to interpret the `frames` byte
// blob's boundaries; `frames` is the last field. (Protobuf is tag-based, so the
// on-wire field order is not guaranteed — this ordering is for schema
// readability only.)
//
// Logical shape of `frames`: [ntask, nenv, t, ncam, h, w, 3], row-major, u8.
message CameraFrames {
  int64 task_index = 1;
  int64 nenv = 2;
  int64 ncam = 3;
  int64 t = 4;
  int64 h = 5;
  int64 w = 6;
  bytes frames = 7;            // raw u8 image data, no per-element overhead
}

// A full testing update: the [task][env][t] matrix of forwards plus optional
// cameras.
message TestUpdate {
  string id = 1;
  repeated TaskUpdates simulation_state = 2;  // [task][env][t]
  repeated CameraFrames frames = 3;
}

// Top-level envelope for the binary channel. The set `oneof` arm is the message
// type identifier; add future binary message types as further arms (= new ids).
message TestingStreamMessage {
  oneof message {
    TestUpdate test_update = 1;
  }
}
